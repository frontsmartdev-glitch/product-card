<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <ul class="products__list"></ul>

<template id="product-template">
    <li class="product-card">
        <img class="product-card__image" src="" alt="">
        <span class="product-card__skin-type"></span>
        <h2 class="product-card__title"></h2>
        <p class="product-card__description"></p>

        <span class="product-card__compound-title">Состав:</span>

        <ul class="product-card__compound-list"></ul>

        <div class="product-card__footer">
            <div class="product-card__price-wrapper">
                <b class="product-card__price-label">Цена</b>
                <span class="product-card__price"></span>
            </div>
            <div class="product-card__button-wrapper">
                <button class="product-card__buy-button">
                    <img
                        src="/img/icon_buy.svg"
                        alt=""
                        class="product-card__buy-icon"
                    >
                    Купить
                </button>
            </div>
        </div>
    </li>
</template>
<script src="main.js"></script>
<script src="homework-7.js"></script>
<script src="homework-8.js"></script>
<script type="module" src="homework-9.js"></script>
<script type="module" src="homework-10.js"></script> 
</body>
</html>
